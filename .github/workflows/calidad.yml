name: Calidad

on:
  push:
  pull_request:

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisión estática
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar y generar PWA
        run: npm run build
